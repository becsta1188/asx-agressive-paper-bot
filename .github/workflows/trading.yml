name: ASX Aggressive Paper Trader

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asx-aggressive-paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggressive paper trader
        run: python bot.py

      - name: Save simulated trading state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ ! -f aggressive_trades.sqlite3 ]; then
            echo "No trading database yet - nothing to save."
            exit 0
          fi

          git add aggressive_trades.sqlite3

          if ! git diff --cached --quiet; then
            git commit -m 'Save aggressive ASX paper trading state'
            git push
          fi
